<html><body style="background:#0b0e12;margin:0;padding:20px;display:flex;flex-wrap:wrap;gap:24px;font:14px monospace;color:#aab">
<script>
function pxCanvas(n){const cv=document.createElement('canvas');cv.width=cv.height=n;const g=cv.getContext('2d');
 const o={cv,g,r:(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0)},
 circ:(cx,cy,rad,c,fill)=>{g.fillStyle=c;for(let y=-rad;y<=rad;y++)for(let x=-rad;x<=rad;x++){const d=Math.hypot(x,y);if(fill?d<=rad+.2:(d<=rad+.35&&d>=rad-1.0))g.fillRect(cx+x,cy+y,1,1)}},
 line:(x0,y0,x1,y1,c)=>{g.fillStyle=c;const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx-dy;for(;;){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>-dy){e-=dy;x0+=sx}if(e2<dx){e+=dx;y0+=sy}}}};return o}
const Y='#f2c76b',D='#b8923f',W='#e6e9ee',L='#c9d1db',S='#8a94a2',K='#10151b',G='#2a3340';
const O={
A_wheel(){const p=pxCanvas(48);p.circ(24,24,19,W,false);p.circ(24,24,18,W,false);p.circ(24,24,17,L,false);
 p.r(5,22,15,4,L);p.r(28,22,15,4,L);p.r(22,26,4,17,L);p.circ(24,24,5,Y,true);p.circ(24,24,3,D,true);p.r(22,5,4,3,Y);return p.cv},
B_license(){const p=pxCanvas(48);p.r(4,10,40,28,W);p.r(4,10,40,6,Y);p.r(4,16,40,1,D);
 p.r(8,20,12,14,'#4a5a70');p.circ(14,25,3,L,true);p.r(10,30,8,4,L);
 p.r(24,21,16,2,S);p.r(24,26,12,2,S);p.r(24,31,14,2,S);p.r(36,12,2,2,K);p.r(39,12,2,2,K);return p.cv},
C_rank(){const p=pxCanvas(48);for(let k=0;k<4;k++){const y0=6+k*9;for(let x=-14;x<=14;x++){const y=y0+14-Math.round(Math.abs(x)*.8)+0;p.r(24+x,y-(14-Math.round(Math.abs(x)*.8))+Math.round(Math.abs(x)*.0),1,0,Y)}}
 for(let k=0;k<4;k++){const base=34-k*8,c=[ '#8a94a2','#c9d1db',Y,'#ffe3a0'][k];for(let x=-13;x<=13;x++){const y=base-Math.round((13-Math.abs(x))*.75);p.r(24+x,y,1,4,c)}}return p.cv},
D_pin(){const p=pxCanvas(48);const pts=[[6,42],[14,40],[22,42],[30,38],[34,32],[28,27],[20,24],[16,19]];
 for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];for(let t=0;t<=1;t+=.1)p.r(Math.round(a[0]+(b[0]-a[0])*t)-1,Math.round(a[1]+(b[1]-a[1])*t)-1,3,3,'#566070')}
 for(let i=0;i<pts.length-1;i++)if(i%2==0)p.r(pts[i][0],pts[i][1],2,2,W);
 p.circ(16,12,9,Y,true);for(let y=0;y<9;y++)p.r(16-(8-y),19+y,(8-y)*2+1,1,Y);p.circ(16,12,4,K,true);p.r(5,43,4,3,W);return p.cv},
E_calendar(){const p=pxCanvas(48);p.r(5,8,38,34,W);p.r(5,8,38,8,'#ef6a5a');p.r(12,4,3,8,S);p.r(33,4,3,8,S);
 for(let j=0;j<3;j++)for(let i=0;i<4;i++){p.r(9+i*9,20+j*7,6,4,(i+j*4)<5?Y:L)}
 p.r(10,21,4,2,K);p.r(19,21,4,2,K);p.r(28,21,4,2,K);p.r(37,21,2,2,K);return p.cv},
F_wreath(){const p=pxCanvas(48);for(let i=0;i<9;i++){const y=38-i*3.6,x=10+Math.sin(i/8*1.4)*-4+ (i<2?0:0);p.r(Math.round(10+Math.pow(i-4,2)*.9),Math.round(y),5,3,i%2?'#7fd68a':'#5fb06b');p.r(Math.round(33-Math.pow(i-4,2)*.9),Math.round(y),5,3,i%2?'#7fd68a':'#5fb06b')}
 p.r(18,12,12,3,Y);p.r(19,15,10,8,Y);p.r(21,23,6,3,D);p.r(23,26,2,5,D);p.r(19,31,10,3,Y);p.r(14,14,4,2,Y);p.r(30,14,4,2,Y);return p.cv},
G_badge(){const p=pxCanvas(48);const hw=y=>Math.min(18,12+Math.min(y,6)*1)*(y<40?1:0);
 for(let y=4;y<44;y++){const t=y<12?(y-4)/8:y>34?(44-y)/10:1;const w=Math.round(10+t*10);p.r(24-w,y,w*2,1,D);if(w>2)p.r(25-w,y,w*2-2,1,Y)}
 p.r(17,14,14,4,K);p.r(17,14,4,10,K);p.r(17,22,14,4,K);p.r(27,22,4,12,K);p.r(17,30,14,4,K);return p.cv},
H_mountain(){const p=pxCanvas(48);for(let y=10;y<44;y++){const w=Math.round((y-10)*.75);p.r(24-w,y,w*2,1,y<18?'#e6e9ee':'#4a5566')}
 p.r(2,38,44,6,'#2f3a48');for(let i=0;i<7;i++){const x=[22,26,19,27,31,25,30][i],y=[16,20,26,30,35,38,41][i];p.r(x,y,3,2,Y)}
 p.r(24,3,1,9,W);p.r(25,3,7,4,'#ef6a5a');return p.cv}
};
for(const k in O){const d=document.createElement('div');const c=O[k]();c.style.cssText='width:192px;height:192px;image-rendering:pixelated;background:#10151b';d.append(c,document.createTextNode(k));d.style.textAlign='center';document.body.append(d)}
</script></body></html>
